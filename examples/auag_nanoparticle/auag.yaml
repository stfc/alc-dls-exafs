# FEFF and pipeline settings for the Au--Ag nanoparticle case study.
# Physics parameters follow the `publication` preset; NLEG is stated
# explicitly because the pipeline default (6) differs from FEFF's own (8).

spectrum_type: EXAFS
edge: L3
radius: 8.0
nleg: 6
control: "1 1 1 1 1 1"
exchange: "0 0 0"       # Hedin--Lundqvist
scf: "4.5 0 30 .2 1"
kmin: 3
kmax: 18
kweight: 2
dk: 4.0
window: hanning

# Pipeline flag defaults; any of these can be overridden on the command line.
cli:
  all_sites: true
  all_frames: true
  ase_kwargs: '{"index":"::10"}'
  reuse_potentials: true
  hdf5: true
  plot_include: average,frames,paths
  max_paths: 10
