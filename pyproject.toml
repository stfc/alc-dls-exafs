[project]
name = "md-exafs"
version = "0.2.0"
authors = [
    { name = "Kane Shenton", email = "jkshenton@gmail.com" },
]
description = "Core engine and CLI for ensemble-averaged EXAFS spectroscopy from MD trajectories"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["xafs", "exafs", "spectroscopy", "feff", "molecular-dynamics", "materials-science"]
dependencies = [
    "ase<4.0,>=3.25",
    "numpy<3.0.0,>=1.22",
    "scipy>=1.11",
    "xraylarch>=0.9.47",
    "pymatgen<2026.0,>=2024.1",
    "h5py>=3.0",
]

[project.optional-dependencies]
cli = [
    "typer<1.0.0,>=0.17.3",
    "rich<14.0.0,>=13.9.1",
    "matplotlib>=3.5",
]
notebooks = [
    "marimo>=0.16.4",
    "weas-widget>=0.1.26",
    "altair>=5.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-book-theme>=1.1.0",
    "myst-parser>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]

[project.urls]
Homepage = "https://github.com/stfc/alc-dls-exafs"
Repository = "https://github.com/stfc/alc-dls-exafs"
Documentation = "https://github.com/stfc/alc-dls-exafs#readme"
"Bug Tracker" = "https://github.com/stfc/alc-dls-exafs/issues"

[project.scripts]
md-exafs = "md_exafs.cli:app"
larch-cli = "md_exafs.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-cov<5.0.0,>=4.1.0",
    "mypy>=1.11.0",
    "types-setuptools",
    "types-PyYAML",
    "types-tqdm",
    "typer<1.0.0,>=0.17.3",
    "rich<14.0.0,>=13.9.1",
    "matplotlib>=3.5",
    "marimo>=0.16.4",
    "weas-widget>=0.1.26",
    "altair>=5.0",
]

pre-commit = [
    "pre-commit<5.0.0,>=4.2.0",
    "ruff<1.0.0,>=0.11.13",
]
[tool.uv]
default-groups = [
    "dev",
    "pre-commit",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "md_exafs"
module-root = ""
source-include = [
    "md_exafs/feff_configs/*.yaml",
    "md_exafs/styles/*.mplstyle",
]


# =======================
# Linting: Ruff
# =======================
[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "scripts",
    "examples",
    "__pypackages__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # stylistic issues
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "BLE", # bugbear extra
    "S",   # bandit security
    "D",   # docstrings (pydocstyle)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
'tests/**/*' = ['D', 'S101', 'S108']
'**/test_*.py' = ['D', 'S101', 'S108']
'__init__.py' = ['D', 'F401']
'md_exafs/cli.py' = ['B008', 'E501', 'BLE001']
'md_exafs/execution.py' = ['S603', 'BLE001', 'E501']
'md_exafs/potentials.py' = ['S603', 'E501']
'md_exafs/paths.py' = ['BLE001', 'S110', 'E501']
'md_exafs/hdf5.py' = ['BLE001', 'S110', 'E501']
'md_exafs/experimental.py' = ['BLE001', 'E501']
'md_exafs/feff_input.py' = ['E501']
'md_exafs/selection.py' = ['E501']
'md_exafs/spectra.py' = ['E501']
'larch_cli_wrapper/**/*.py' = ['D', 'F401', 'F403']
'notebooks/*.py' = ['F841', 'B018', 'E501', 'BLE001', 'S110', 'D']


# =======================
# Type checking: mypy
# =======================
[tool.mypy]
python_version = "3.10"
strict = true
# Note: `strict = true` enables:
#   disallow_untyped_defs, check_untyped_defs, no_implicit_optional, warn_no_return, etc.
# So we don't need to redeclare them.

# Enable extra diagnostics
enable_error_code = ["redundant-expr", "truthy-bool"]

# Handle untyped third-party libraries
[[tool.mypy.overrides]]
module = [
    "larch.*",
    "larixite.*",
    "ase.*",
    "pymatgen.*",
]
ignore_missing_imports = true


# =======================
# Testing: pytest
# =======================
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]


# =======================
# Coverage: pytest-cov
# =======================
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
    # Thin/UI-only modules with no meaningful logic to unit test:
    "*/larch_cli_wrapper/marimo_utils.py",
    "*/larch_cli_wrapper/__main__.py",
    "*/larch_cli_wrapper/styles/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
