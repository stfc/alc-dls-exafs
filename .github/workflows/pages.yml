name: Documentation and Interactive Apps

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "notebooks/**"
      - "md_exafs/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "notebooks/**"
      - "md_exafs/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          python-version: "3.12"

      - name: Install documentation and notebook dependencies
        run: |
          uv pip install -e ".[docs,notebooks,cli]"

      - name: Build Sphinx documentation
        run: |
          uv run sphinx-build -b html docs _site -W --keep-going

      - name: Export interactive Marimo WASM apps
        run: |
          uv run marimo export html-wasm notebooks/debye_waller.py \
            -o _site/apps/debye_waller \
            --mode run

          uv run marimo export html-wasm notebooks/nanoparticle_builder.py \
            -o _site/apps/nanoparticle_builder \
            --mode run

          # Backward-compatibility paths for previously shared notebook links
          mkdir -p _site/notebooks
          cp -r _site/apps/debye_waller _site/notebooks/debye_waller
          cp -r _site/apps/nanoparticle_builder _site/notebooks/nanoparticle_builder

          # Prevent GitHub Pages from ignoring files prefixed with underscores (e.g. _static)
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
